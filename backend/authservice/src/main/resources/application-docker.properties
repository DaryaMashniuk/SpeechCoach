spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username= ${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database=postgresql

logging.level.root = INFO
userservice.url=http://user-service:8081

management.endpoints.web.exposure.include=health, info, prometheus, metrics, tracing
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=b3
management.otlp.tracing.endpoint=${TRACING_ENDPOINT:http://otel-collector:4318/v1/traces}
management.endpoint.prometheus.access=unrestricted
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.service=${spring.application.name}
management.opentelemetry.resource-attributes.service.name=${spring.application.name}