server.port=8083

authservice.whitelist=${AUTHSERVICE_WHITELIST}


logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.http.server.reactive=INFO
logging.level.org.springframework.web.reactive=INFO

authservice.url=http://authentication-service:8082
orderservice.url=http://order-service:8080
userservice.url=http://user-service:8081
paymentservice.url=http://payment-service:8084


management.endpoint.health.show-details=always
management.endpoint.prometheus.access=unrestricted
management.endpoint.metrics.access=unrestricted
management.prometheus.metrics.export.enabled=true
management.endpoints.web.exposure.include=health, info, prometheus, metrics, tracing
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=b3
management.otlp.tracing.endpoint=${TRACING_ENDPOINT:http://otel-collector:4318/v1/traces}

management.metrics.tags.application=${spring.application.name}
management.metrics.tags.namespace=${K8S_NAMESPACE:default}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.opentelemetry.resource-attributes.service.name=${spring.application.name}

spring.cloud.gateway.httpclient.connect-timeout=10000
spring.cloud.gateway.httpclient.response-timeout=30s