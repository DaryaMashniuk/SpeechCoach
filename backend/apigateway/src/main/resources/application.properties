spring.application.name=apigateway

server.port=8083

authservice.whitelist=/api/v1/auth/login,/api/v1/auth/register,/api/v1/auth/refresh,/api/v1/auth/validate

authservice.url=http://localhost:8082
orderservice.url=http://localhost:8080
userservice.url=http://localhost:8081
paymentservice.url=http://localhost:8084

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.http.server.reactive=DEBUG
logging.level.org.springframework.web.reactive=DEBUG

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
